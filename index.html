function go(){let h=location.hash.slice(1)||'home';if(!V[h])h='home';
 $('#app').innerHTML=V[h]();scrollTo(0,0);
 $('#nv').innerHTML=[['home','Home'],['about','About'],['team','Team'],['contact','Contact']].map(x=>`<a href="#${x[0]}" class="${x[0]===h?'on':''}">${x[1]}</a>`).join('');
 bind(h)}
/* card popup */
const md=$('#md');
function closeCard(){md.classList.remove('on');document.body.style.overflow='';setTimeout(()=>{if(!md.classList.contains('on'))md.innerHTML=''},350)}
function openCard(id){const d=TEAM.find(c=>c.cid===id);if(!d)return;
 md.innerHTML=`<div class="mx"><button class="mc" aria-label="Close">&times;</button><div class="stage"><div class="fw"><div class="mv">${card({...d,lanyard:false})}<div class="sh"></div></div></div></div><p class="hint">Drag the card to move it</p></div>`;
 const z=Math.min(1.15,(innerWidth-40)/370,(innerHeight-130)/640);$('.mv',md).style.zoom=z;
 const st=$('.stage',md),mv=$('.mv',md);
 const mvf=ev=>{const r=st.getBoundingClientRect(),x=(ev.clientX-r.left)/r.width-.5,y=(ev.clientY-r.top)/r.height-.5;
  mv.style.transform=`rotateY(${Math.max(-40,Math.min(40,x*70))}deg) rotateX(${Math.max(-30,Math.min(30,-y*50))}deg) scale(1.03)`;
  mv.firstElementChild&&(mv.lastElementChild.style.setProperty('--x',(x+.5)*100+'%'),mv.lastElementChild.style.setProperty('--y',(y+.5)*100+'%'))};
 st.onpointerdown=ev=>{st.setPointerCapture(ev.pointerId);mv.classList.add('drag');mv.style.animation='none';mvf(ev)};
 st.onpointermove=mvf;
 const rs=()=>{mv.classList.remove('drag');mv.style.transform=''};
 st.onpointerup=st.onpointercancel=rs;st.onpointerleave=ev=>{if(ev.pointerType==='mouse')rs()};
 $('.mc',md).onclick=closeCard;
 md.classList.add('on');document.body.style.overflow='hidden'}
md.onclick=e=>{if(!e.target.closest('.stage'))closeCard()};
addEventListener('keydown',e=>{if(e.key==='Escape')closeCard()});
function bind(h){
 document.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>openCard(b.dataset.open));
 if(h==='home'){const e=$('#hc');e.parentElement.onmousemove=ev=>{const r=e.getBoundingClientRect(),x=(ev.clientX-r.left)/r.width-.5,y=(ev.clientY-r.top)/r.height-.5;e.style.transform=`rotateY(${x*22}deg) rotateX(${-y*16}deg)`};e.parentElement.onmouseleave=()=>e.style.transform=''}
 if(h==='contact')$('#cf').onsubmit=e=>{e.preventDefault();e.target.reset();toast('Message sent. Thank you!')}}
addEventListener('hashchange',go);
$('#lgo').innerHTML=LOGO('#d4af37',38);
$('#il').innerHTML='APEX ONE'.split('').map((c,i)=>`<span class="l" style="animation-delay:${i*.12}s">${c===' '?'&nbsp;':c}</span>`).join('');
const hideIntro=()=>$('#intro').classList.add('out');$('#intro').onclick=hideIntro;setTimeout(hideIntro,3600);
go();
</script></body></html>
